<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Northbridge Intelligence{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0f1a;
            --surface: #111827;
            --surface2: #1a2235;
            --border: #1f2d42;
            --accent: #2563eb;
            --accent-light: #3b82f6;
            --gold: #f59e0b;
            --green: #10b981;
            --red: #ef4444;
            --orange: #f97316;
            --text: #e2e8f0;
            --muted: #64748b;
            --font: 'Inter', system-ui, sans-serif;
        }
        body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }
        a { color: var(--accent-light); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Layout */
        .layout { display: flex; min-height: 100vh; }
        .sidebar {
            width: 240px; background: var(--surface); border-right: 1px solid var(--border);
            padding: 24px 0; position: fixed; height: 100vh; overflow-y: auto;
        }
        .main { margin-left: 240px; padding: 32px; flex: 1; }

        /* Logo */
        .logo { padding: 0 20px 24px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
        .logo-text { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
        .logo-text span { color: var(--gold); }
        .logo-sub { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

        /* Nav */
        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 20px; color: var(--muted); font-size: 14px;
            border-left: 3px solid transparent; transition: all 0.15s;
        }
        .nav-item:hover, .nav-item.active {
            color: var(--text); background: var(--surface2);
            border-left-color: var(--accent); text-decoration: none;
        }
        .nav-section { padding: 16px 20px 6px; font-size: 10px; color: var(--muted);
                       letter-spacing: 1px; text-transform: uppercase; }

        /* Cards */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
        .card-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .card-value { font-size: 32px; font-weight: 700; }
        .card-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

        /* Grid */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

        /* Score badges */
        .score { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 700; }
        .score-high { background: rgba(16,185,129,0.15); color: var(--green); }
        .score-mid { background: rgba(245,158,11,0.15); color: var(--gold); }
        .score-low { background: rgba(100,116,139,0.15); color: var(--muted); }

        .verdict-buy { background: rgba(16,185,129,0.15); color: var(--green); padding: 4px 10px; border-radius: 4px; font-weight: 700; font-size: 13px; }
        .verdict-investigate { background: rgba(245,158,11,0.15); color: var(--gold); padding: 4px 10px; border-radius: 4px; font-weight: 700; font-size: 13px; }
        .verdict-pass { background: rgba(100,116,139,0.1); color: var(--muted); padding: 4px 10px; border-radius: 4px; font-weight: 700; font-size: 13px; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border);
             font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
        tr:hover td { background: var(--surface2); }

        /* Forms */
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
        input, select, textarea {
            width: 100%; background: var(--surface2); border: 1px solid var(--border);
            color: var(--text); padding: 10px 12px; border-radius: 6px; font-size: 14px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none; border-color: var(--accent);
        }
        .btn {
            padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer;
            font-size: 14px; font-weight: 600; transition: all 0.15s;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-light); }
        .btn-gold { background: var(--gold); color: #0a0f1a; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        /* Page header */
        .page-header { margin-bottom: 28px; }
        .page-title { font-size: 24px; font-weight: 700; }
        .page-sub { color: var(--muted); font-size: 14px; margin-top: 4px; }

        /* Opportunity flags */
        .flag { display: inline-block; margin: 2px; padding: 2px 8px; border-radius: 3px;
                font-size: 11px; background: rgba(37,99,235,0.1); color: var(--accent-light); }

        /* Regen zone status */
        .status-active { color: var(--green); }
        .status-planning { color: var(--gold); }
        .status-complete { color: var(--muted); }

        /* Analysis box */
        .analysis-box {
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: 8px; padding: 20px; white-space: pre-wrap;
            font-size: 14px; line-height: 1.7; color: var(--text);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .sidebar { display: none; }
            .main { margin-left: 0; padding: 20px; }
            .grid-4 { grid-template-columns: 1fr 1fr; }
            .grid-3 { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
<div class="layout">
    <nav class="sidebar">
        <div class="logo">
            <div class="logo-text">North<span>bridge</span></div>
            <div class="logo-sub">Property Intelligence</div>
        </div>
        <div class="nav-section">Overview</div>
        <a href="/" class="nav-item {% if request.url.path == '/' %}active{% endif %}">
            📊 Dashboard
        </a>
        <div class="nav-section">Deal Engine</div>
        <a href="/deals" class="nav-item {% if '/deals' in request.url.path %}active{% endif %}">
            🎯 Deal Analyser
        </a>
        <a href="/land-registry" class="nav-item {% if '/land-registry' in request.url.path %}active{% endif %}">
            📋 Land Registry
        </a>
        <div class="nav-section">Intelligence</div>
        <a href="/planning" class="nav-item {% if '/planning' in request.url.path %}active{% endif %}">
            🏗️ Planning Uplift
        </a>
        <a href="/regen-zones" class="nav-item {% if '/regen-zones' in request.url.path %}active{% endif %}">
            🔄 Regen Zones
        </a>
    </nav>
    <main class="main">
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
